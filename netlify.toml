# Netlify config for ApplyGuard PH (SPA + Edge Proxy architecture)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security Headers Configuration
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.paypal.com https://www.sandbox.paypal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.paypal.com https://api-m.sandbox.paypal.com; frame-src 'self' https://www.paypal.com https://www.sandbox.paypal.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(self)"
    X-Frame-Options = "DENY"

# Single-page app routing redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
